<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PM 에이전트 — 자연어 → 즉시 시각화</title>
<style>
  :root {
    --bg:#f6f7f9; --panel:#fff; --ink:#1e2430; --muted:#6b7280; --line:#e5e7eb;
    --brand:#2f6f8f; --good:#2e7d54; --warn:#c98a00; --bad:#c0392b; --mut:#94a3b8;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
         background:var(--bg); color:var(--ink); height:100vh; display:flex; }
  /* 좌: 챗 */
  .chat { width:340px; min-width:300px; border-right:1px solid var(--line); background:var(--panel);
          display:flex; flex-direction:column; }
  .chat header { padding:16px; border-bottom:1px solid var(--line); }
  .chat header h1 { font-size:15px; margin:0; }
  .chat header p { font-size:12px; color:var(--muted); margin:4px 0 0; }
  .log { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .msg { padding:9px 12px; border-radius:12px; font-size:13px; line-height:1.5; max-width:92%; white-space:pre-wrap; }
  .msg.me { align-self:flex-end; background:var(--brand); color:#fff; border-bottom-right-radius:3px; }
  .msg.bot { align-self:flex-start; background:#eef1f4; border-bottom-left-radius:3px; }
  .msg.bot .assume { color:var(--muted); font-size:11px; margin-top:6px; }
  .suggest { display:flex; flex-wrap:wrap; gap:6px; padding:0 14px 8px; }
  .suggest button { font-size:11px; border:1px solid var(--line); background:#fff; color:var(--muted);
                    border-radius:14px; padding:4px 10px; cursor:pointer; }
  .suggest button:hover { border-color:var(--brand); color:var(--brand); }
  .composer { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); }
  .composer input { flex:1; border:1px solid var(--line); border-radius:8px; padding:9px 11px; font-size:13px; }
  .composer button { border:0; background:var(--brand); color:#fff; border-radius:8px; padding:0 16px; cursor:pointer; font-size:13px; }
  /* 우: 차트 */
  .view { flex:1; overflow:auto; padding:24px 28px; }
  .view h2 { font-size:18px; margin:0 0 2px; }
  .view .sub { color:var(--muted); font-size:12px; margin-bottom:18px; }
  .kpis { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
  .kpi { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 18px; min-width:130px; }
  .kpi .l { font-size:12px; color:var(--muted); }
  .kpi .v { font-size:24px; font-weight:650; margin-top:2px; }
  .kpi.good .v{color:var(--good);} .kpi.bad .v{color:var(--bad);} .kpi.warn .v{color:var(--warn);}
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 20px; }
  .notes { margin-top:14px; }
  .note { background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; font-size:12px; padding:8px 12px; border-radius:8px; margin-top:6px; }
  .empty { color:var(--muted); text-align:center; margin-top:80px; }
  /* bar chart */
  .row { display:grid; grid-template-columns:150px 1fr 84px; align-items:center; gap:10px; margin:7px 0; font-size:13px; }
  .row .lab { text-align:right; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .track { background:#eef1f4; border-radius:6px; height:20px; overflow:hidden; }
  .fill { height:100%; border-radius:6px; }
  .fill.good{background:var(--good);} .fill.warn{background:var(--warn);} .fill.bad{background:var(--bad);}
  .fill.muted{background:var(--mut);} .fill.neutral,.fill.brand{background:var(--brand);}
  .val { font-size:12px; color:var(--muted); }
  /* grouped bar */
  .gb { margin:12px 0; }
  .gb .name { font-size:13px; font-weight:600; margin-bottom:4px; }
  .gb .pair { display:grid; grid-template-columns:44px 1fr 110px; align-items:center; gap:8px; margin:3px 0; font-size:12px; }
  .gb .pair .k { color:var(--muted); }
  /* table */
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th,td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; }
  .pill { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px; }
  .pill.good{background:#e6f4ec;color:var(--good);} .pill.warn{background:#fdf3e0;color:var(--warn);}
  .pill.bad{background:#fbeae8;color:var(--bad);} .pill.muted{background:#eef1f4;color:var(--muted);}
</style>
</head>
<body>
  <aside class="chat">
    <header>
      <h1>PM 에이전트</h1>
      <p>과제관리 · 경영시스템 연계 · 자연어 → 즉시 시각화</p>
    </header>
    <div class="log" id="log"></div>
    <div class="suggest" id="suggest"></div>
    <div class="composer">
      <input id="q" placeholder="예: 메모리 사업부 진척 어때?" autocomplete="off" />
      <button id="send">전송</button>
    </div>
  </aside>

  <main class="view" id="view">
    <div class="empty">질문을 입력하면 여기에 시각화가 나타납니다.</div>
  </main>

<script>
const SAMPLES = ["메모리 사업부 진척 현황", "예산 대비 집행 실적", "지연되고 있는 일정", "시스템LSI 개발단계 과제 상태"];
const log = document.getElementById('log'), view = document.getElementById('view'), q = document.getElementById('q');
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

const sug = document.getElementById('suggest');
SAMPLES.forEach(s => { const b=document.createElement('button'); b.textContent=s; b.onclick=()=>{q.value=s;send();}; sug.appendChild(b); });

function addMsg(cls, html){ const d=document.createElement('div'); d.className='msg '+cls; d.innerHTML=html; log.appendChild(d); log.scrollTop=log.scrollHeight; }

async function send(){
  const text = q.value.trim(); if(!text) return;
  addMsg('me', esc(text)); q.value='';
  try {
    const r = await fetch('/chat', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({text})});
    const data = await r.json();
    if(data.error){ addMsg('bot', '⚠ '+esc(data.error)); return; }
    addMsg('bot', esc(data.reply).replace(/\n/g,'<br>') + '<div class="assume">'+data.assumptions.map(esc).join('<br>')+'</div>');
    render(data.chartSpec);
  } catch(e){ addMsg('bot', '⚠ '+esc(e.message)); }
}
document.getElementById('send').onclick = send;
q.addEventListener('keydown', e => { if(e.key==='Enter') send(); });

// ---- 시각화 어댑터 (교체 가능): ChartSpec → DOM
function render(spec){
  const kpis = (spec.kpis||[]).map(k =>
    `<div class="kpi ${k.tone}"><div class="l">${esc(k.label)}</div><div class="v">${esc(k.value)}<span style="font-size:13px;color:var(--muted)">${esc(k.unit)}</span></div></div>`).join('');
  const notes = (spec.notes||[]).map(n=>`<div class="note">⚠ ${esc(n)}</div>`).join('');
  const src = (spec.meta?.sources||[]).join(' · ');
  view.innerHTML =
    `<h2>${esc(spec.title)}</h2><div class="sub">${esc(spec.type)} · 출처: ${esc(src)}</div>`+
    `<div class="kpis">${kpis}</div><div class="card">${CHART[spec.type] ? CHART[spec.type](spec) : '<i>미지원 차트</i>'}</div>`+
    `<div class="notes">${notes}</div>`;
}

const CHART = {
  bar(spec){
    return spec.data.map(r=>{
      const p = r[spec.encoding.y];
      return `<div class="row"><div class="lab">${esc(r[spec.encoding.x])}</div>
        <div class="track"><div class="fill ${r.tone}" style="width:${p}%"></div></div>
        <div class="val">${p}${esc(spec.encoding.unit||'')} · ${esc(r.상태||'')}</div></div>`;
    }).join('');
  },
  grouped_bar(spec){
    const mx = Math.max(...spec.data.map(r=>r.계획예산), 1);
    return spec.data.map(r=>{
      const bar=(v,cls)=>`<div class="track"><div class="fill ${cls}" style="width:${v/mx*100}%"></div></div>`;
      return `<div class="gb"><div class="name">${esc(r.사업부)}</div>
        <div class="pair"><span class="k">계획</span>${bar(r.계획예산,'brand')}<span class="val">${r.계획예산} ${esc(spec.encoding.unit)}</span></div>
        <div class="pair"><span class="k">집행</span>${bar(r.집행액,'good')}<span class="val">${r.집행액} ${esc(spec.encoding.unit)} · ${r.집행률}%</span></div></div>`;
    }).join('');
  },
  gantt(spec){
    const head = spec.columns.map(c=>`<th>${esc(c)}</th>`).join('');
    const rows = spec.data.map(r=>{
      const d = r.지연일==null ? '-' : (r.지연일>0?'+':'')+r.지연일+'일';
      return `<tr>
        <td>${esc(r.과제)}</td><td>${esc(r.게이트)}</td><td>${esc(r.계획일)}</td>
        <td>${esc(r.실적일||'-')}</td><td>${esc(d)}</td>
        <td><span class="pill ${r.tone}">${esc(r.상태)}</span></td></tr>`;
    }).join('');
    return `<table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
  },
};
</script>
</body>
</html>
